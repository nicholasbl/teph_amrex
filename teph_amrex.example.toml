# Copy this file to <data-directory>/teph_amrex.toml. teph_amrex loads it
# automatically when started with that data directory:
#
#   cp teph_amrex.example.toml /path/to/data/teph_amrex.toml
#   cargo run --release -- /path/to/data
#
# Quantity names and numeric values below are examples; replace them with fields
# and ranges present in your dataset.

# Built-in colormaps may be named by stem or filename (for example, "vik" or
# "vik.png"). An absolute path to a PNG, JPEG, or EXR image also works.
colormap = "vik"
slice_colormap = "lajolla"

# These defaults apply to every isosurface and slice unless overridden on that
# entry. Decimation accepts exactly one of `percentage` (in (0, 100]) or a
# positive `triangles` count. Omit `decimation` to keep the original mesh.
decimation = { percentage = 25.0 }

# All relaxation fields are optional. Omitted fields use the multires library
# defaults. lambda must be in [0, 1], mu in [-1, 0], and max_step_ratio >= 0.
# Omit `relax` entirely to disable relaxation.
relax = { iterations = 4, lambda = 0.5, mu = -0.53, max_step_ratio = 0.1, lock_boundaries = true }

# Optional domain guide slabs. Each entry chooses an axis plus either a boundary
# side (`min` or `max`) or an exact dataset-coordinate value. Thickness is in
# dataset units and defaults to 1% of the domain's longest extent. Colors are
# normalized RGBA values. Guides move with the navigable dataset, receive
# shadows, and never cast them. Entries default to enabled when omitted.
[[domain_guides]]
enabled = false
axis = "y"
side = "min"
color = [0.95, 0.35, 0.15, 0.35]

[[domain_guides]]
enabled = false
axis = "y"
side = "max"
color = [0.2, 0.55, 0.95, 0.35]

# Arbitrary internal or external guide coordinates are also supported.
[[domain_guides]]
enabled = false
axis = "x"
value = 0.0
thickness = 0.01
color = [0.9, 0.9, 0.2, 0.25]

# Optional fixed world-space poster. Relative image paths start at the data
# directory. Position and look_at are world meters. At scale 1.0 the image is
# 0.5 meters wide, with its height derived from the image aspect ratio.
[infographic]
enabled = false
image = "infographic.png"
position = [1.5, 1.0, 0.0]
look_at = [0.0, 1.0, 0.0]
scale = 1.0

# Create an isosurface for `density = 0.5` and color it using `temperature`.
# color_by, color_min, and color_max must either all be present or all omitted.
# alpha and transmission are optional values in [0, 1]. Alpha defaults to 1
# (opaque); transmission defaults to 0. Transmission is specular and produces
# a thin-film glass effect. For the clearest glass, keep alpha at 1.
[[isosurfaces]]
quantity = "density"
value = 0.5
alpha = 0.7
color_by = "temperature"
color_min = 250.0
color_max = 2000.0
flip = false

# Additional entries create additional surfaces. Per-entry decimation and relax
# settings override the top-level defaults.
[[isosurfaces]]
quantity = "temperature"
value = 1000.0
transmission = 0.85
flip = true
decimation = { triangles = 50000 }
relax = { iterations = 2, lock_boundaries = false }

# Slice axes are x, y, or z. `min` and `max` are optional, but must be supplied
# together; when omitted, the viewer chooses the sample range. A slice may also
# override the default slice colormap.
[[slices]]
quantity = "temperature"
axis = "z"
value = 0.0
min = 250.0
max = 2000.0
colormap = "lipari"
flip = false
