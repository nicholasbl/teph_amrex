[package]
name = "teph_amrex"
version = "0.1.0"
edition = "2024"

[dependencies]
tephrite_rs = { git = "https://github.com/InsightCenterNoodles/tephrite_rs.git", rev = "2de4d12109af827aab2d59319960efbd972c9efe" }
amrex_rs = { git = "https://github.com/nicholasbl/amrex_rs.git", rev = "59017aa0ad9212fb7561d14bd981b40d7197e088" }
bevy = "0.19"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
crossbeam-queue = "0.3"
memmap2 = "0.9"
mini-moka = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
bevy_fontmesh = "0.6"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
