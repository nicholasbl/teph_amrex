[package]
name = "teph_amrex"
version = "0.1.0"
edition = "2024"

[dependencies]
tephrite_rs = { git = "https://github.com/InsightCenterNoodles/tephrite_rs.git", rev = "2de4d12109af827aab2d59319960efbd972c9efe" }
multires = { git = "https://github.com/nicholasbl/multires.git", rev = "b94cd733361e3cf34107dccfa44ab7c51fefa5fd" }
bevy = "0.19"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
crossbeam-queue = "0.3"
mini-moka = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
bevy_fontmesh = "0.6"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
